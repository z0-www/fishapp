name: fishtextadventure
description: 鱼者文游 — 本地优先的手机文字角色扮演
publish_to: none
version: 0.5.8+34
environment:
  sdk: ^3.14.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.1.0
  flutter_riverpod: ^3.0.0
  go_router: ^18.0.0
  drift: ^2.32.0
  drift_flutter: ^0.3.0
  flutter_secure_storage: ^10.0.0
  dio: ^5.9.0
  url_launcher: ^6.3.0
  crypto: 3.0.8
  cryptography: ^2.9.0
  path_provider: ^2.1.6
  path: 1.9.1
  html: 0.15.7
  archive: ^4.7.1
  cupertino_icons: 1.0.9
  # Shared pure-Dart .yuzhe codec also used by the offline converter.
  yuzhe_codec:
    path: packages/yuzhe_codec
  # Web-only DOM interop (file picker, downloads, Web Storage, fetch SSE).
  web: ^1.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.32.0
  build_runner: ^2.10.0
  sqlite3: ^3.9.1
  flutter_launcher_icons: ^0.14.4
  # Offline converter, used only by cross-format tests.
  fish_converter:
    path: converter
flutter:
  uses-material-design: true
  assets:
    - assets/branding/fish_logo.png
    - assets/pricing/deepseek_wallet_prices.json
    - assets/tutorials/deepseek_keys/
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/fish_logo.png
  min_sdk_android: 24
  remove_alpha_ios: true
  background_color_ios: '#FFFFFF'
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground: assets/branding/fish_logo.png
  adaptive_icon_foreground_inset: 16
